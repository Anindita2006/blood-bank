# Deployment: tells Kubernetes to keep 2 copies (pods) of our container running.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blood-bank
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blood-bank
  template:
    metadata:
      labels:
        app: blood-bank
    spec:
      containers:
        - name: blood-bank
          image: blood-bank:latest
          imagePullPolicy: IfNotPresent     # use the locally built image
          ports:
            - containerPort: 8080
          livenessProbe:                     # restart the pod if /health stops responding
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
---
# Service: gives the pods one stable address, reachable from outside on port 30080.
apiVersion: v1
kind: Service
metadata:
  name: blood-bank-service
spec:
  type: NodePort
  selector:
    app: blood-bank
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
